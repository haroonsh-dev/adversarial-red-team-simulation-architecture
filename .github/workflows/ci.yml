# =============================================================================
# ARTSA CI/CD Pipeline
# Runs on every push and PR to main/develop branches
# =============================================================================

name: ARTSA CI/CD

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  OPENAI_API_KEY: "sk-ci-mock-key"
  ARTSA_LOG_LEVEL: "WARNING"
  # Seeded into the frontend auth store by e2e/seedAuth.ts so Playwright runs
  # as an authenticated admin (the /config/me identity endpoint is mocked).
  ARTSA_API_KEY: "sk-ci-e2e-admin-key"

jobs:
  # ─────────────────────────────────────────────────────────────────
  # Stage 1: Lint & Type Check
  # ─────────────────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install ruff
        run: pip install ruff

      - name: Risk framework JSON sync
        run: bash scripts/check_risk_framework_sync.sh

      - name: Doc↔config sync (README claims vs. code)
        run: bash scripts/check_doc_config_sync.sh

      - name: Ruff check (production modules — hard gate)
        run: |
          ruff check \
            backend/src/api/routes/risks.py \
            backend/src/api/routes/enterprise.py \
            backend/src/core/severity.py \
            backend/src/core/models/ingest.py \
            backend/src/core/models/risks.py \
            backend/src/services/mcp_proxy.py \
            backend/src/services/otel_ingest.py \
            backend/src/data/agentic_risk_framework.py

      - name: Ruff format (production modules — hard gate)
        run: |
          ruff format --check \
            backend/src/api/routes/risks.py \
            backend/src/api/routes/enterprise.py \
            backend/src/core/severity.py \
            backend/src/services/mcp_proxy.py

      - name: Ruff check (extended scope — hard gate)
        run: |
          ruff check \
            backend/src/api/routes/campaigns.py \
            backend/src/api/routes/attack_library.py \
            backend/src/api/routes/forensics.py \
            backend/src/api/routes/ingest.py \
            backend/src/api/routes/health.py \
            backend/src/agents/guardrails/ \
            backend/src/api/main.py \
            backend/src/api/dependencies.py

  # ─────────────────────────────────────────────────────────────────
  # Stage 2: Unit & Integration Tests (Backend)
  # ─────────────────────────────────────────────────────────────────
  test:
    name: "🧪 Backend Tests"
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests with coverage
        env:
          PYTHONPATH: backend
        run: |
          python -m pytest backend/tests/ \
            --tb=short \
            -v
          # Gateway tests (LLM proxy, providers) are part of the main suite
          # (tests/test_llm_proxy.py, tests/test_providers_api.py); the legacy
          # api-gateway/ package was removed.

      - name: Golden evaluation gate (independent curated set)
        env:
          PYTHONPATH: backend
          ENVIRONMENT: testing
        run: python backend/scripts/golden_gate.py

  # ─────────────────────────────────────────────────────────────────
  # Stage 2b: Postgres Integration Tests
  # ─────────────────────────────────────────────────────────────────
  test_postgres:
    name: "🐘 Postgres Integration"
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: artsa
          POSTGRES_PASSWORD: artsa_test
          POSTGRES_DB: artsa_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Postgres persistence tests
        env:
          PYTHONPATH: backend
          ENVIRONMENT: integration_test
          RUN_POSTGRES_TESTS: "1"
          USE_SQLITE: "false"
          DATABASE_URL: postgresql+asyncpg://artsa:artsa_test@localhost:5432/artsa_test
          SYNC_DATABASE_URL: postgresql://artsa:artsa_test@localhost:5432/artsa_test
        run: |
          python -m pytest backend/tests/integration/test_postgres_persistence.py -v --tb=short

  # ─────────────────────────────────────────────────────────────────
  # Stage 3: Next.js Frontend Production Build
  # ─────────────────────────────────────────────────────────────────
  frontend_build:
    name: "🎨 Frontend Next.js Build"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install Frontend Dependencies & Build
        run: |
          cd frontend
          npm ci || npm install
          npm run lint
          npm run typecheck
          npm run test
          npm run build

      - name: Install Playwright browser
        run: cd frontend && npx playwright install chromium --with-deps

      - name: Run Playwright E2E smoke tests
        run: cd frontend && npm run test:e2e

  # ─────────────────────────────────────────────────────────────────
  # Stage 4: Benchmark harness smoke
  # ─────────────────────────────────────────────────────────────────
  benchmark:
    name: "📊 Benchmark Smoke"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run benchmark harness smoke
        env:
          PYTHONPATH: backend
          ENVIRONMENT: testing
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python -m pytest backend/tests/test_benchmark_harness.py backend/tests/test_ablation_harness.py -q

  # ─────────────────────────────────────────────────────────────────
  # Stage 5: TypeScript SDK tests
  # The @artsa/sdk ships a 19-case vitest suite (fail-closed, retry, fetch
  # blocking) that previously never ran in CI. Keep it green here so a
  # regression in the TS client can't silently ship.
  # ─────────────────────────────────────────────────────────────────
  sdk:
    name: "🟦 TypeScript SDK"
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Install SDK dependencies
        run: cd sdk/typescript && npm ci || npm install

      - name: Typecheck
        run: cd sdk/typescript && npm run typecheck

      - name: Run SDK tests
        run: cd sdk/typescript && npm test

  # ─────────────────────────────────────────────────────────────────
  # Stage 6: Containment regression gate (recall / FPR / latency SLOs)
  # ─────────────────────────────────────────────────────────────────
  regression_gate:
    name: "🚦 Regression Gate"
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Run containment regression gate
        env:
          PYTHONPATH: backend
          ENVIRONMENT: testing
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          python backend/scripts/ci_regression_gate.py
